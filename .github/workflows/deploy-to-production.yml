name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  STAGE: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1.321.0

      # Gate the deploy on the specs. This repo is the alerting path, so a
      # broken monitor must not reach an environment.
      - run: bundle install
      - run: bundle exec rspec

      - run: bundle config set path 'vendor/bundle' && bundle install
        working-directory: lambda/checker

      - run: bundle config set path 'vendor/bundle' && bundle install
        working-directory: lambda/pagerduty

      - uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::382373577178:role/GithubActions-Serverless-Lambda-Role
          aws-region: ${{ env.AWS_REGION }}

      - run: yarn global add serverless@3

      - run: make deploy-${{ env.STAGE }}
        env:
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
