version: 2
updates:

  - package-ecosystem: "bundler"
    directory: "/lambda/checker"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: "bundler"
    directory: "/lambda/pagerduty"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7